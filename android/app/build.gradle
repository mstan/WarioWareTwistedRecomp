plugins {
    id "com.android.application"
}

// The Android shell (SDL2, org.gbarecomp activities, manifest, native CMake
// root, payload staging) is shared by every gbarecomp game and lives in the
// engine: gbarecomp/platform/android/gbarecomp-app.gradle. Engine / UI
// checkouts default to the pinned submodules; a feature worktree can be
// selected with -PgbarecompRoot=... / -PrecompUiRoot=... (or the
// GBARECOMP_ROOT / RECOMP_UI_ROOT environment variables).
def gameRoot = rootDir.parentFile
def pick = { String prop, String env, File fallback ->
    def v = providers.gradleProperty(prop).orNull ?: System.getenv(env)
    return v ? new File(v) : fallback
}
def engineRoot = pick("gbarecompRoot", "GBARECOMP_ROOT", new File(gameRoot, "gbarecomp"))
def recompUiRoot = pick("recompUiRoot", "RECOMP_UI_ROOT", new File(gameRoot, "recomp-ui"))

ext.gbaGame = [
    applicationId : "com.mstan.wariowaretwisted",
    versionCode   : 2,
    versionName   : "0.0.2",
    title         : "WarioWare: Twisted!",
    romLabel      : "WarioWare: Twisted! ROM",
    romSha1       : ["f0102d0d6f7596fe853d5d0a94682718278e083a"],
    romSize       : 16777216,
    romFile       : "warioware_twisted_usa.gba",
    biosRequired  : true,
    orientation   : "landscape",
    gyro          : true,
    // Bumped from the pre-template shell's "3" so existing installs receive
    // the current game TOML; saves and settings are never overwritten.
    payloadVersion: "4",
    setupNote     : "Rotate the phone around its screen-normal axis to play; touch " +
                    "and gamepads are also supported.",
    variant       : "warioware_twisted",
    gameToml      : new File(rootDir, "game_android.toml"),
    gameRoot      : gameRoot,
    engineRoot    : engineRoot,
    recompUiRoot  : recompUiRoot,
    // arm64 phones for releases; debug adds x86_64 for the stock emulator.
    releaseAbis   : ["arm64-v8a"],
]

apply from: new File(engineRoot, "platform/android/gbarecomp-app.gradle")
