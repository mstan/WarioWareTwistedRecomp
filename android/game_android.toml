# Android-installed runtime configuration. Gradle packages this as
# variants/warioware_twisted/game.toml under the app's private files directory.
[game]
name = "WarioWare: Twisted!"
short_name = "warioware_twisted"
default_region = "usa"

[program]
name = "WarioWare: Twisted! (USA)"
id = "RZWE"
load_address = 0x08000000
size = 0x01000000
entry_pc = 0x08000000

[identity]
sha1 = "f0102d0d6f7596fe853d5d0a94682718278e083a"
md5 = "89579f4dfe1ed24a7cd16a6a61a72a17"

[bios]
path = "../../bios/gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
hle = true

[rom]
path = "../../roms/warioware_twisted_usa.gba"
sha1 = "f0102d0d6f7596fe853d5d0a94682718278e083a"

[save]
type = "sram"
size = 32768
path = "../../saves/warioware_twisted_usa.sav"

[runtime]
debug_port = 19876
window_title = "WarioWareTwistedRecomp"

[video]
screen = "raw"
view_width = 240
resize_view = false

[audio]
shadow = false

[[extra_func]]
addr = 0x0812ED40
mode = "thumb"
name = "m4aSoundVSync"
note = "IRQ callback reloads DMA1/DMA2 when the PCM buffer period expires"
