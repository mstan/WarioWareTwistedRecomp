# WarioWare: Twisted! (USA, RZWE, revision 0).
# Hybrid configuration consumed by both gba_recompile and the runtime.
#
# The engine auto-detects this cartridge's gyro/rumble GPIO device from RZWE.
# See docs/gyro-plan.md for the PC controls and future Android provider.

[game]
name = "WarioWare: Twisted!"
short_name = "warioware_twisted"
default_region = "usa"

[program]
name = "WarioWare: Twisted! (USA)"
id = "RZWE"
load_address = 0x08000000
size = 0x01000000
entry_pc = 0x08000000
speculative_literal_harvest = false
codegen_shards = 16

[identity]
sha1 = "f0102d0d6f7596fe853d5d0a94682718278e083a"
md5 = "89579f4dfe1ed24a7cd16a6a61a72a17"

[bios]
path = "../../../gbarecomp-warioware-twisted/bios/gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
# The static real-BIOS path currently stalls at the BIOS-to-cartridge handoff.
# Boot HLE skips only the intro; the real recompiled BIOS remains available for
# IRQ dispatch and unhandled SWIs during gameplay.
hle = true

[rom]
path = "roms/warioware_twisted_usa.gba"
sha1 = "f0102d0d6f7596fe853d5d0a94682718278e083a"

[save]
type = "sram"
size = 32768
path = "../../saves/warioware_twisted_usa.sav"

[runtime]
debug_port = 19876
window_title = "WarioWareTwistedRecomp"

[video]
screen = "frontlit"
view_width = 240
resize_view = false

[audio]
shadow = false

# IRQ-time MP2K DMA restart callback. DMA2 completion reaches it through the
# runtime-copied IWRAM IRQ dispatcher, so the cartridge's direct call graph
# cannot discover it. Declare it explicitly to keep that hot audio path native.
[[extra_func]]
addr = 0x0812ED40
mode = "thumb"
name = "m4aSoundVSync"
note = "IRQ callback reloads DMA1/DMA2 when the PCM buffer period expires"

# Reached through an indirect callback during early UI initialization. The
# ordinary call graph discovers the containing function but not this internal
# Thumb entry, which is required by cold-cache/mobile builds without overlays.
[[extra_func]]
addr = 0x08008E3C
mode = "thumb"
resume = true
name = "earlyUiIndirectCallback"
note = "indirect internal Thumb entry observed during cold Android startup"

